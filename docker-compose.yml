# ===========================================
# OralSuite - Docker Compose (Desarrollo)
# ===========================================
#
# Uso:
#   docker compose up -d        # Levantar servicios
#   docker compose down         # Parar servicios
#   docker compose down -v      # Parar y eliminar datos (resetear BD)
#   docker compose logs -f      # Ver logs
#   docker compose logs -f api  # Ver solo logs de la API
#
# Conexión a PostgreSQL (TablePlus, DBeaver, etc.):
#   Host: localhost
#   Port: 5432
#   User: oralsuite
#   Password: oralsuite123
#   Database: oralsuite
#
# API disponible en: http://localhost:3000
#

services:
  # ===========================================
  # API NestJS - Backend
  # ===========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oralsuite-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: api
      # Base de datos - usar nombre del servicio 'postgres' como host
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: oralsuite
      DB_PASSWORD: oralsuite123
      DB_NAME: oralsuite
      # JWT
      JWT_SECRET: oralsuite-dev-secret-change-in-production-2024
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: oralsuite-refresh-secret-change-in-production-2024
      JWT_REFRESH_EXPIRES_IN: 7d
      # CORS
      CORS_ORIGINS: http://localhost:3100,http://localhost:3200
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oralsuite-network

  # ===========================================
  # PostgreSQL - Base de Datos
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: oralsuite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oralsuite
      POSTGRES_PASSWORD: oralsuite123
      POSTGRES_DB: oralsuite
      # Timezone
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "5432:5432"
    volumes:
      # Datos persistentes
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización (se ejecuta solo la primera vez)
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oralsuite -d oralsuite"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oralsuite-network

  # ===========================================
  # pgAdmin (Opcional) - UI para PostgreSQL
  # ===========================================
  # Descomentar si prefieres usar pgAdmin en lugar de TablePlus
  #
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: oralsuite-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@oralsuite.com
  #     PGADMIN_DEFAULT_PASSWORD: admin123
  #     PGADMIN_CONFIG_SERVER_MODE: "False"
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     - postgres
  #   networks:
  #     - oralsuite-network

# ===========================================
# Volúmenes Persistentes
# ===========================================
volumes:
  postgres_data:
    name: oralsuite-postgres-data
  # pgadmin_data:
  #   name: oralsuite-pgadmin-data

# ===========================================
# Red
# ===========================================
networks:
  oralsuite-network:
    name: oralsuite-network
    driver: bridge
